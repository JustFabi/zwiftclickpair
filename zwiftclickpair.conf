# Panel: proper name-routing on :80 next to the other vhosts...
<VirtualHost *:80>
    ServerName clickbridge.local
    ServerAlias zwiftclickpair.local
    DocumentRoot /var/www/zwiftclickpair/panel/public

    <Directory /var/www/zwiftclickpair/panel/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.php

        <FilesMatch "\.php$">
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/zwiftclickpair-error.log
    CustomLog ${APACHE_LOG_DIR}/zwiftclickpair-access.log combined
</VirtualHost>

# ...and its own port as catch-all-default, so it is always reachable via
# http://<Pi-IP>:8090 without .local DNS (e.g. phones, TVs, IP-only setups).
Listen 8090
<VirtualHost *:8090>
    DocumentRoot /var/www/zwiftclickpair/panel/public

    <Directory /var/www/zwiftclickpair/panel/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.php

        <FilesMatch "\.php$">
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/zwiftclickpair-error.log
    CustomLog ${APACHE_LOG_DIR}/zwiftclickpair-access.log combined
</VirtualHost>
